services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changeops}
      POSTGRES_USER: ${POSTGRES_USER:-changeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - changeops-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-changeops} -d ${POSTGRES_DB:-changeops}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/${POSTGRES_DB:-changeops}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: ["python", "-m", "changeops.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/${POSTGRES_DB:-changeops}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/${POSTGRES_DB:-changeops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/changeops_test
      EXTRACTION_MODEL_PROVIDER: ${EXTRACTION_MODEL_PROVIDER:-openai}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-5.6-luna}
      EXTRACTION_MODEL_TIMEOUT_SECONDS: ${EXTRACTION_MODEL_TIMEOUT_SECONDS:-120}
      EXTRACTION_MODEL_MAX_RETRIES: ${EXTRACTION_MODEL_MAX_RETRIES:-0}
      INTERPRETATION_MODEL_PROVIDER: ${INTERPRETATION_MODEL_PROVIDER:-openai}
      INTERPRETATION_MODEL: ${INTERPRETATION_MODEL:-gpt-5.6-luna}
      INTERPRETATION_MODEL_TIMEOUT_SECONDS: ${INTERPRETATION_MODEL_TIMEOUT_SECONDS:-120}
      INTERPRETATION_MODEL_MAX_RETRIES: ${INTERPRETATION_MODEL_MAX_RETRIES:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build: ./web
    environment:
      CHANGEOPS_API_BASE_URL: ${CHANGEOPS_API_BASE_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  changeops-postgres:
