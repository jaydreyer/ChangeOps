services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changeops}
      POSTGRES_USER: ${POSTGRES_USER:-changeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - changeops-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-changeops} -d ${POSTGRES_DB:-changeops}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/${POSTGRES_DB:-changeops}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: ["python", "-m", "changeops.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/${POSTGRES_DB:-changeops}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeops}:${POSTGRES_PASSWORD:-changeops}@db:5432/${POSTGRES_DB:-changeops}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  changeops-postgres:
