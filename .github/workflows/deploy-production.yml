name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Prepare images and task revisions while off, or deploy to an enabled window
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: changeops-production-release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APPLICATION_URL: ${{ vars.APPLICATION_URL }}
  ECS_CLUSTER: changeops-demo-cluster
  ECS_SERVICE: changeops-demo-service
  APPLICATION_TASK_FAMILY: changeops-demo-application
  MIGRATION_TASK_FAMILY: changeops-demo-migration
  BOOTSTRAP_TASK_FAMILY: changeops-demo-bootstrap
  API_REPOSITORY: changeops-demo-api
  WEB_REPOSITORY: changeops-demo-web
  RELEASE_MODE: ${{ inputs.release_mode }}

jobs:
  deploy:
    name: migrate, deploy, and verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@v6

      - name: Validate protected deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "${AWS_DEPLOY_ROLE_ARN}"
          test -n "${AWS_REGION}"
          test "${GITHUB_REF}" = "refs/heads/main"
          if test "${RELEASE_MODE}" = "deploy"; then
            case "${APPLICATION_URL}" in
              https://*) ;;
              *) echo "Deploy mode requires an HTTPS APPLICATION_URL." >&2; exit 1 ;;
            esac
          fi

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Enforce the reviewed release phase
        run: |
          set -euo pipefail
          desired_count="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].desiredCount' \
              --output text
          )"
          case "${RELEASE_MODE}" in
            prepare)
              test "${desired_count}" = "0" || {
                echo "Prepare mode is permitted only while the demo service is off." >&2
                exit 1
              }
              ;;
            deploy)
              test "${desired_count}" = "1" || {
                echo "Deploy mode requires the separately approved demo window." >&2
                exit 1
              }
              ;;
            *)
              echo "Unsupported release mode." >&2
              exit 1
              ;;
          esac

      - name: Log in to the named ECR registry
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve immutable image locations
        id: images
        run: |
          set -euo pipefail
          api_uri="$(
            aws ecr describe-repositories \
              --repository-names "${API_REPOSITORY}" \
              --query 'repositories[0].repositoryUri' \
              --output text
          )"
          web_uri="$(
            aws ecr describe-repositories \
              --repository-names "${WEB_REPOSITORY}" \
              --query 'repositories[0].repositoryUri' \
              --output text
          )"
          echo "api=${api_uri}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "web=${web_uri}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          if aws ecr describe-images \
            --repository-name "${API_REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "api_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "api_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if aws ecr describe-images \
            --repository-name "${WEB_REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "web_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "web_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend image
        if: steps.images.outputs.api_exists != 'true'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.api }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=changeops-api
          cache-to: type=gha,mode=max,scope=changeops-api

      - name: Build and publish frontend image
        if: steps.images.outputs.web_exists != 'true'
        uses: docker/build-push-action@v7.2.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.web }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=changeops-web
          cache-to: type=gha,mode=max,scope=changeops-web

      - name: Register reviewed task-definition revisions
        id: task_definitions
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${APPLICATION_TASK_FAMILY}" \
            > application-described.json
          python scripts/render_ecs_task_definition.py \
            --input application-described.json \
            --output application-release.json \
            --container "api=${API_IMAGE}" \
            --container "web=${WEB_IMAGE}"
          application_arn="$(
            aws ecs register-task-definition \
              --cli-input-json file://application-release.json \
              --tags key=Application,value=ChangeOps key=Environment,value=demo \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          aws ecs describe-task-definition \
            --task-definition "${MIGRATION_TASK_FAMILY}" \
            > migration-described.json
          python scripts/render_ecs_task_definition.py \
            --input migration-described.json \
            --output migration-release.json \
            --container "migration=${API_IMAGE}"
          migration_arn="$(
            aws ecs register-task-definition \
              --cli-input-json file://migration-release.json \
              --tags key=Application,value=ChangeOps key=Environment,value=demo \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          aws ecs describe-task-definition \
            --task-definition "${BOOTSTRAP_TASK_FAMILY}" \
            > bootstrap-described.json
          python scripts/render_ecs_task_definition.py \
            --input bootstrap-described.json \
            --output bootstrap-release.json \
            --container "bootstrap=${API_IMAGE}"
          bootstrap_arn="$(
            aws ecs register-task-definition \
              --cli-input-json file://bootstrap-release.json \
              --tags key=Application,value=ChangeOps key=Environment,value=demo \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"
          {
            echo "application=${application_arn}"
            echo "migration=${migration_arn}"
            echo "bootstrap=${bootstrap_arn}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run controlled migration and fictional-data bootstrap
        env:
          MIGRATION_TASK_DEFINITION: ${{ steps.task_definitions.outputs.migration }}
          BOOTSTRAP_TASK_DEFINITION: ${{ steps.task_definitions.outputs.bootstrap }}
        run: |
          set -euo pipefail
          network_configuration="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].networkConfiguration' \
              --output json
          )"

          run_controlled_task() {
            local label="$1"
            local task_definition="$2"
            local container_name="$3"
            local command_json="$4"
            local log_group="$5"
            local overrides task_arn task_id description exit_code reason
            overrides="$(
              jq -cn --arg name "${container_name}" --argjson command "${command_json}" \
                '{containerOverrides:[{name:$name,command:$command}]}'
            )"
            task_arn="$(
              aws ecs run-task \
                --cluster "${ECS_CLUSTER}" \
                --launch-type FARGATE \
                --task-definition "${task_definition}" \
                --network-configuration "${network_configuration}" \
                --overrides "${overrides}" \
                --started-by "github-${GITHUB_RUN_ID}" \
                --tags key=Application,value=ChangeOps key=Environment,value=demo \
                --query 'tasks[0].taskArn' \
                --output text
            )"
            test -n "${task_arn}" && test "${task_arn}" != "None"
            aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${task_arn}"
            description="$(
              aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${task_arn}"
            )"
            exit_code="$(
              jq -r --arg name "${container_name}" \
                '.tasks[0].containers[] | select(.name==$name) | .exitCode // -1' \
                <<<"${description}"
            )"
            reason="$(
              jq -r --arg name "${container_name}" \
                '.tasks[0].containers[] | select(.name==$name) | .reason // "none"' \
                <<<"${description}"
            )"
            if test "${exit_code}" != "0"; then
              task_id="${task_arn##*/}"
              aws logs get-log-events \
                --log-group-name "${log_group}" \
                --log-stream-name "${container_name}/${container_name}/${task_id}" \
                --query 'events[].message' \
                --output text || true
              echo "${label} failed with exit ${exit_code}; reason=${reason}." >&2
              exit 1
            fi
            echo "${label} succeeded."
          }

          run_controlled_task \
            migration "${MIGRATION_TASK_DEFINITION}" migration \
            '["alembic","upgrade","head"]' /changeops/demo/migration
          run_controlled_task \
            bootstrap "${BOOTSTRAP_TASK_DEFINITION}" bootstrap \
            '["python","-m","changeops.deployment_bootstrap"]' /changeops/demo/bootstrap

      - name: Roll out the application revision
        id: deploy
        env:
          APPLICATION_TASK_DEFINITION: ${{ steps.task_definitions.outputs.application }}
        run: |
          set -euo pipefail
          previous="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].taskDefinition' \
              --output text
          )"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${APPLICATION_TASK_DEFINITION}" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}"

      - name: Verify HTTPS readiness, authentication, and correlation
        if: inputs.release_mode == 'deploy'
        run: |
          set -euo pipefail
          request_id="deployment-${GITHUB_SHA}"
          response_headers="$(mktemp)"
          ready_payload="$(
            curl --fail --silent --show-error \
              --dump-header "${response_headers}" \
              --header "X-Request-ID: ${request_id}" \
              "${APPLICATION_URL%/}/readyz"
          )"
          test "$(jq -r '.status' <<< "${ready_payload}")" = "ok"
          test "$(jq -r '.api' <<< "${ready_payload}")" = "ok"
          grep -Eiq '^strict-transport-security: max-age=31536000; includesubdomains' \
            "${response_headers}" || {
              echo "The public readiness response is missing the reviewed HSTS policy." >&2
              exit 1
            }
          root_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${APPLICATION_URL%/}/"
          )"
          test "${root_status}" = "302" || {
            echo "The product root did not enforce Cognito authentication." >&2
            exit 1
          }

          found=0
          for attempt in $(seq 1 10); do
            found="$(
              aws logs filter-log-events \
                --log-group-name /changeops/demo/api \
                --filter-pattern "\"${request_id}\"" \
                --query 'length(events)' \
                --output text
            )"
            test "${found}" -gt 0 && break
            echo "Waiting for correlated CloudWatch log event (${attempt}/10)."
            sleep 5
          done
          test "${found}" -gt 0 || {
            echo "The readiness request ID did not reach structured API logs." >&2
            exit 1
          }

      - name: Roll back application revision after a failed rollout or smoke check
        if: failure() && steps.deploy.outputs.previous != ''
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.deploy.outputs.previous }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${PREVIOUS_TASK_DEFINITION}" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}"
