name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: changeops
  OPENAI_API_KEY: ""

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize and validate bootstrap root
        run: |
          terraform -chdir=infra/terraform/bootstrap init
          terraform -chdir=infra/terraform/bootstrap validate
          terraform -chdir=infra/terraform/bootstrap test

      - name: Initialize and validate demo environment
        run: |
          terraform -chdir=infra/terraform/environments/demo init -backend=false
          terraform -chdir=infra/terraform/environments/demo validate

      - name: Test ADR-0022 invariants and failure guards
        run: terraform -chdir=infra/terraform/environments/demo test

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        env:
          CHANGEOPS_API_BASE_URL: http://api:8000
        run: npm run build

      - name: Restore cached API image
        id: api-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/changeops-api-image.tar
          key: changeops-api-${{ runner.os }}-${{ hashFiles('Dockerfile', 'pyproject.toml') }}

      - name: Load cached API image
        if: steps.api-image-cache.outputs.cache-hit == 'true'
        run: docker image load --input /tmp/changeops-api-image.tar

      - name: Build Compose services
        run: docker compose build

      - name: Build production backend image
        run: docker build --target production --tag changeops-api:production .

      - name: Save API image cache
        if: steps.api-image-cache.outputs.cache-hit != 'true'
        run: docker image save changeops-api:latest --output /tmp/changeops-api-image.tar

      - name: Lint
        run: docker compose run --rm api ruff check src migrations scripts tests

      - name: Check formatting
        run: docker compose run --rm api ruff format --check src migrations scripts tests

      - name: Run test suite
        run: docker compose run --rm api pytest

      - name: Run extraction evaluation
        run: >-
          docker compose run --rm api python -m changeops.evaluation.extraction
          tests/golden/extraction/v1/dataset.json

      - name: Run workflow evaluation
        run: >-
          docker compose run --rm api python -m changeops.evaluation.workflow
          tests/golden/workflow/v1/dataset.json

      - name: Run interpretation evaluation
        run: >-
          docker compose run --rm api python -m changeops.evaluation.interpretation
          tests/golden/interpretation/v1/dataset.json

      - name: Run approval workflow evaluation
        run: >-
          docker compose run --rm api python -m changeops.evaluation.approval_workflow
          tests/golden/approval_workflow/v1/dataset.json

      - name: Stop Compose services
        if: always()
        run: docker compose down -v

  migration:
    name: migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build migration image
        run: docker compose build migrate seed

      - name: Start an empty PostgreSQL database
        run: |
          docker compose down -v
          docker compose up --wait db

      - name: Discover current Alembic head
        run: docker compose run --rm --no-deps migrate alembic heads

      - name: Upgrade empty database to head
        run: docker compose run --rm --no-deps migrate alembic upgrade head

      - name: Seed populated dependency rows
        run: docker compose run --rm seed

      - name: Downgrade head by one revision
        run: docker compose run --rm --no-deps migrate alembic downgrade -1

      - name: Upgrade immediate predecessor back to head
        run: docker compose run --rm --no-deps migrate alembic upgrade head

      - name: Verify database is at head
        run: docker compose run --rm --no-deps migrate alembic current --check-heads

      - name: Stop Compose services
        if: always()
        run: docker compose down -v
